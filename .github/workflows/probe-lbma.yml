name: Probe LBMA

# THROWAWAY. Delete this file once a second source is chosen — it exists to answer
# questions, not to be maintained.
#
# SETTLED BY EARLIER ROUNDS, not re-measured here:
#   * LBMA answers a runner with HTTP 200 carrying a complete ~12KB Cloudflare
#     interstitial (run 31906804255, 20/20, 20 distinct bodies). Its remedy is a JS
#     reload, and `http.get` builds and discards a Session per call, so retry is dead.
#   * The same URL answered a different runner 5/5 with 913KB of valid JSON
#     (run 31974956815). The failure is per-egress, not per-day.
#   * FRED's LBMA fix was removed with all ICE Benchmark Administration data on
#     2022-01-31. fxratesapi is rejected: weekend carry-forward, ≈ −0.34% against the
#     PM fix, wrong fixing time, 366-day history wall. stooq.com and fsapi.gold.org
#     serve `User-agent: * / Disallow: /`.
#
# THIS ROUND asks whether the *administrator* of the benchmark publishes it anywhere a
# cookie-less client can read, and whether a central bank redistributes a usable gold
# price. Two arms fetched, five attempts each:
#
#   * lbma_gold_pm  — the control, unchanged, so every round is comparable to the last.
#   * bundesbank_gold_frankfurt — BBEX3.D.XAU.DEM.EA.AC.C01. Found through the
#     Bundesbank's own SDMX directory rather than guessed: /rest/metadata/dataflow/BBK
#     lists BBEX3 as the exchange-rate-and-precious-metal flow, and the flow's bulk CSV
#     export has exactly three columns whose name contains "Gold", all the same series
#     at three frequencies. It is the Frankfurt Stock Exchange fixing in D-marks per
#     kilo and it stops at the end of 1998. The arm is kept because a measured
#     "discontinued in 1998" is a fact and a remembered one is not.
#
# ICE Benchmark Administration is NOT fetched, because after looking there is nothing
# to fetch. IBA administers the LBMA Gold Price and publishes no unauthenticated
# endpoint for it: ice.com/iba/lbma-gold-silver-price says the settings "are available
# under licence from IBA (including for valuation and pricing activities and for use in
# transactions)" and points prospective licensees at iba-licensing@ice.com;
# developer.ice.com's LBMA Gold Price catalogue entry lists delivery over ICE Connect,
# ICE Data API, ICE Data Files and ICE Global Network, all commercial, with intraday
# data at four hours' delay and delayed data at midnight London. LBMA moved its own
# historic benchmark tables to the members' portal in the week commencing 2025-11-24,
# keeping "the most recent daily auction price … and chart data" public. The public
# route to this benchmark is therefore the control arm, and that is the finding.
#
# Each arm carries two kinds of field, never mixed: **measured** — transport, last
# observation, lag against the tolerance read out of the asset, history depth, weekday
# coverage, robots verdict — and **declared** — fixing time and licence terms, each
# with the URL it was read from. A declared field is a citation, not a measurement.
#
# GC=F stays excluded. Yahoo is not tested here. It writes nothing to the repository.

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: "Fetches per arm."
        type: string
        default: "5"

permissions:
  contents: read

defaults:
  run:
    working-directory: engine

jobs:
  probe:
    name: does the administrator or a central bank publish this at all
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - run: uv sync --frozen

      - name: fetch each candidate repeatedly and record what comes back
        env:
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          from collections import Counter
          from datetime import UTC, date, datetime

          import requests

          from aurex.assets import get as get_asset
          from aurex.config import HTTP_COURTESY_DELAY, HTTP_TIMEOUT, USER_AGENT
          from aurex.data.sources import http
          from aurex.data.sources.lbma import GOLD_PM_URL

          attempts = int(os.environ["ATTEMPTS"])

          # Hammering somebody else's host, so be more courteous than production rather
          # than less: the configured delay is a floor here, not a target.
          delay = max(HTTP_COURTESY_DELAY, 2.0)

          # The tolerance the nightly refuses on, read from the asset rather than
          # recalled, so the lag column is this repository's number.
          chain = get_asset("gold").price_sources()["xauusd"]
          tolerance = chain.freshness.describe() if chain.freshness else None

          today = datetime.now(UTC).date()
          _ISO = re.compile(r"^\d{4}-\d{2}-\d{2}$")

          # --- parsers, each returning every observation date the body carries -------

          def dates_lbma(body: bytes) -> list[str]:
              return [row["d"] for row in json.loads(body) if row.get("d")]

          def dates_bundesbank(body: bytes) -> list[str]:
              """Bundesbank CSV: a metadata preamble, then `date,value[,flag]` rows.

              Rows carrying "." are the Bundesbank's missing marker and are not
              observations — counting them would put the last observation on a day the
              series does not actually cover.
              """
              out = []
              for line in body.decode("utf-8-sig", "replace").splitlines():
                  parts = line.split(",")
                  if len(parts) >= 2 and _ISO.match(parts[0].strip('"')) and parts[1] not in (".", ""):
                      out.append(parts[0].strip('"'))
              return out

          arms = [
              {
                  "name": "lbma_gold_pm",
                  "role": "control — the same URL every round has used",
                  "url": GOLD_PM_URL,
                  "parse": dates_lbma,
                  "honour_robots": False,
                  "declared": {
                      "fixing_time": "15:00 London (LBMA Gold Price PM auction)",
                      "fixing_time_source": "https://www.lbma.org.uk/prices-and-data/lbma-gold-price",
                      "licence": (
                          "Administered by ICE Benchmark Administration; benchmark settings "
                          "available under licence from IBA. LBMA moved historic tables to "
                          "its members' portal in the week commencing 2025-11-24, keeping "
                          "the most recent daily auction price and chart data public. The "
                          "status of this JSON feed under those terms is unresolved and is "
                          "the subject of an outgoing enquiry."
                      ),
                      "licence_source": "https://www.lbma.org.uk/articles/lbma-benchmark-prices-data-tables-are-moving",
                  },
              },
              {
                  "name": "bundesbank_gold_frankfurt",
                  "role": "candidate — the only gold price series in the Bundesbank's directory",
                  "url": (
                      "https://api.statistiken.bundesbank.de/rest/data/BBEX3/"
                      "D.XAU.DEM.EA.AC.C01?format=csv&lang=en"
                  ),
                  "parse": dates_bundesbank,
                  "honour_robots": True,
                  "declared": {
                      "series_key": "BBEX3.D.XAU.DEM.EA.AC.C01",
                      "series_title": (
                          "Gold price in Frankfurt am Main / Frankfurt Stock Exchange fixing "
                          "/ 1 kg of fine gold = DM ... / up to the end of 1998"
                      ),
                      "how_found": (
                          "/rest/metadata/dataflow/BBK → BBEX3; then the flow's bulk CSV "
                          "export, whose only 'Gold' columns are this series at D, M and A."
                      ),
                      "fixing_time": "Frankfurt Stock Exchange fixing; quote is DM per kg of fine gold",
                      "fixing_time_source": "https://api.statistiken.bundesbank.de/rest/data/BBEX3/D.XAU.DEM.EA.AC.C01?format=csv&lang=en",
                      "licence": (
                          "Bundesbank statistics are free to use with attribution; the series "
                          "itself is discontinued, so the licence is moot."
                      ),
                      "licence_source": "https://www.bundesbank.de/en/statistics/time-series-databases",
                  },
              },
          ]

          # Looked at and not fetched, recorded here rather than in a comment so the
          # artifact carries the reason the candidate list is as short as it is.
          not_fetched = [
              {
                  "name": "ice_benchmark_administration",
                  "why": (
                      "The administrator of the LBMA Gold Price publishes no "
                      "unauthenticated endpoint. Delivery is ICE Connect / ICE Data API / "
                      "ICE Data Files / ICE Global Network, all licensed; intraday data at "
                      "four hours' delay, delayed data at midnight London."
                  ),
                  "sources": [
                      "https://www.ice.com/iba/lbma-gold-silver-price",
                      "https://developer.ice.com/fixed-income-data-services/catalog/lbma-gold-price",
                      "https://www.lbma.org.uk/articles/lbma-benchmark-prices-data-tables-are-moving",
                  ],
                  "contact": "iba-licensing@ice.com",
              },
          ]

          # Assembled to match aurex.data.sources.http.get exactly rather than calling
          # it, because `get` raises for non-2xx and a probe must record the non-2xx.
          headers = {"User-Agent": USER_AGENT, "Accept-Encoding": "gzip, deflate"}

          def egress_now() -> str:
              try:
                  return requests.get("https://api.ipify.org", timeout=10).text.strip()
              except Exception as exc:  # noqa: BLE001 - diagnostic only, never fatal
                  return f"unknown: {type(exc).__name__}"

          egress_start = egress_now()

          def robots_verdict(url: str) -> dict[str, object]:
              """What robots.txt says. Now read with Aurex's own client, not urllib."""
              record: dict[str, object] = {}
              try:
                  record["allows"] = http.robots_allows(url)
              except Exception as exc:  # noqa: BLE001
                  record["allows"] = f"error: {type(exc).__name__}: {exc}"
              origin = "/".join(url.split("/")[:3])
              try:
                  response = requests.get(f"{origin}/robots.txt", headers=headers, timeout=15)
                  record |= {
                      "robots_status": response.status_code,
                      "robots_head": response.content[:200].decode("utf-8", "replace"),
                  }
              except Exception as exc:  # noqa: BLE001
                  record["robots_error"] = f"{type(exc).__name__}: {exc}"
              return record

          def shape(dates: list[str]) -> dict[str, object]:
              """History depth and weekday coverage, from the observations themselves."""
              parsed = sorted({date.fromisoformat(d) for d in dates})
              if not parsed:
                  return {"observations": 0}
              recent = parsed[-260:]
              weekdays = Counter(d.strftime("%a") for d in recent)
              return {
                  "observations": len(parsed),
                  "first_observation": parsed[0].isoformat(),
                  "last_observation": parsed[-1].isoformat(),
                  "history_years": round((parsed[-1] - parsed[0]).days / 365.25, 1),
                  # Measured, not assumed: a series that quotes weekends is a different
                  # kind of series from one that prints on London business days, and
                  # weekend rows are how a stale quote satisfies a freshness guard.
                  "weekday_counts_last_260_observations": dict(sorted(weekdays.items())),
                  "quotes_weekends": bool(weekdays["Sat"] or weekdays["Sun"]),
              }

          records: list[dict[str, object]] = []
          per_arm: dict[str, dict[str, object]] = {}

          for arm in arms:
              robots = robots_verdict(arm["url"])
              summary: dict[str, object] = {
                  "role": arm["role"],
                  "url": arm["url"],
                  "declared": arm["declared"],
                  "robots": robots,
                  "counts": {},
              }
              per_arm[arm["name"]] = summary

              if arm["honour_robots"] and robots.get("allows") is not True:
                  summary["counts"] = {"robots-skipped": attempts}
                  print(json.dumps({"arm": arm["name"], "outcome": "robots-skipped"}))
                  continue

              hashes: set[str] = set()
              for attempt in range(1, attempts + 1):
                  time.sleep(delay)

                  started = time.monotonic()
                  record: dict[str, object] = {
                      "arm": arm["name"],
                      "attempt": attempt,
                      "at": datetime.now(UTC).isoformat(),
                      "url": arm["url"],
                      "egress_ip": egress_start,
                  }
                  try:
                      response = requests.get(arm["url"], headers=headers, timeout=HTTP_TIMEOUT)
                  except Exception as exc:  # noqa: BLE001 - a transport failure is a result
                      record |= {
                          "outcome": "transport-error",
                          "error": f"{type(exc).__name__}: {exc}",
                          "elapsed_s": round(time.monotonic() - started, 3),
                      }
                      records.append(record)
                      print(json.dumps(record))
                      continue

                  body = response.content
                  digest = hashlib.sha256(body).hexdigest()
                  hashes.add(digest)
                  record |= {
                      "status": response.status_code,
                      "elapsed_s": round(time.monotonic() - started, 3),
                      "bytes": len(body),
                      "sha256": digest,
                      "describe": http.describe_response(response),
                      "headers": {
                          name: value
                          for name, value in response.headers.items()
                          if name.lower() in http._DIAGNOSTIC_HEADERS
                          or name.lower().startswith("cf-")
                      },
                      # Names only, never values. Whatever state a responder hands out
                      # is dropped when this response goes out of scope, because
                      # http.get builds a Session per call and keeps no jar.
                      "set_cookie_names": sorted(response.cookies.keys()),
                      "body_head": repr(body[:200]),
                  }

                  if response.status_code >= 400:
                      record["outcome"] = "http-error"
                  else:
                      try:
                          dates = arm["parse"](body)
                      except Exception as exc:  # noqa: BLE001 - unparseable is a result
                          record |= {
                              "outcome": "unparseable",
                              "error": f"{type(exc).__name__}: {exc}",
                          }
                      else:
                          measured = shape(dates)
                          last = measured.get("last_observation")
                          record |= {"outcome": "ok" if last else "parsed-but-empty"} | measured
                          if last:
                              lag = (today - date.fromisoformat(str(last))).days
                              record["lag_days"] = lag
                              if tolerance:
                                  record["within_tolerance"] = lag <= tolerance["max_lag_days"]

                  records.append(record)
                  # The shape block repeats identically on every attempt; print the
                  # transport line and keep the file as the full record.
                  print(json.dumps({k: v for k, v in record.items() if k != "body_head"})[:600])

              counts: dict[str, int] = {}
              for entry in records:
                  if entry["arm"] == arm["name"]:
                      counts[str(entry.get("outcome"))] = counts.get(str(entry.get("outcome")), 0) + 1
              latest = next(
                  (e for e in reversed(records) if e["arm"] == arm["name"] and e.get("last_observation")),
                  None,
              )
              summary |= {
                  "counts": counts,
                  "failure_rate": round(1 - counts.get("ok", 0) / attempts, 3),
                  "distinct_bodies": len(hashes),
                  "measured": (
                      {
                          key: latest[key]
                          for key in (
                              "observations",
                              "first_observation",
                              "last_observation",
                              "history_years",
                              "weekday_counts_last_260_observations",
                              "quotes_weekends",
                              "lag_days",
                              "within_tolerance",
                          )
                          if key in latest
                      }
                      if latest
                      else None
                  ),
              }

          artifact = {
              "summary": {
                  "attempts_per_arm": attempts,
                  "delay_s": delay,
                  "user_agent": USER_AGENT,
                  "timeout_s": HTTP_TIMEOUT,
                  "egress_ip_start": egress_start,
                  "egress_ip_end": egress_now(),
                  "run_date_utc": today.isoformat(),
                  "xauusd_freshness_tolerance": tolerance,
                  "recorded_at": datetime.now(UTC).isoformat(),
              },
              "arms": per_arm,
              "considered_not_fetched": not_fetched,
              "attempts": records,
          }

          with open("lbma-probe.json", "w") as handle:
              json.dump(artifact, handle, indent=2)

          print("\n" + json.dumps({"summary": artifact["summary"], "arms": per_arm}, indent=2))
          PY

      # `if: always()` because a probe that only uploads its findings when nothing went
      # wrong is not a probe.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbma-probe
          path: engine/lbma-probe.json
          if-no-files-found: error
