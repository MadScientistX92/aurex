name: Probe LBMA

# THROWAWAY. Delete this file once a second source is chosen — it exists to answer
# questions, not to be maintained.
#
# WHAT THE FIRST RUN SETTLED (run 31906804255, 20 attempts, one runner). The failure is
# not a truncated body. LBMA answers a runner with HTTP 200 carrying a complete ~12KB
# Cloudflare-fronted interstitial whose own remedy is a JavaScript reload five seconds
# later carrying the state it just set. `aurex.data.sources.http.get` calls the
# module-level `requests.get`, which builds and discards a Session per call, so nothing
# it is handed is ever sent back. A courtesy-delayed retry cannot satisfy that page on
# any attempt number and is rejected as a repair. The repair is a second source on a
# different host.
#
# WHAT THIS RUN ASKS. Which hosts will serve a cookie-less, honestly-identified client
# from a runner, and what each one's last observation is when they do. Four fetched
# arms, five attempts each, one sitting:
#
#   * lbma_gold_pm      — the control, the same URL and instrumentation as the settled
#                         run, so this sitting is comparable to that one rather than
#                         being a fresh set of numbers about a different day;
#   * fred_lbma_gold_pm — the FRED redistribution of the LBMA PM fix. Reconnaissance
#                         from a residential IP says FRED 404s it and the series page
#                         redirects to the St. Louis Fed's announcement that ICE
#                         Benchmark Administration data was removed from FRED on
#                         2022-01-31. The arm is kept because "we checked" and "we
#                         assumed it was gone" are not the same claim;
#   * fred_dexinus      — a live FRED series Aurex already loads, present only so the
#                         arm above can be read. A 404 beside a 200 on the same host is
#                         a removed series; two 404s would be FRED refusing runners, and
#                         one arm cannot tell those apart;
#   * fxratesapi_xau    — the non-FRED, non-Yahoo candidate. Why this one: of the hosts
#                         reachable without an API key, stooq.com and fsapi.gold.org
#                         (World Gold Council) both carry `User-agent: * / Disallow: /`,
#                         which bars Aurex before any transport question is asked;
#                         data.nasdaq.com answers 403 from an Imperva edge;
#                         exchangerate.host, Polygon, Twelve Data and Tiingo require a
#                         key, which the nightly job has no secrets for by design; and
#                         gold-api.com and the Swissquote public feed serve a snapshot
#                         with no history. fxratesapi answers a cookie-less client with
#                         daily JSON and has no robots.txt to bar us. Its known
#                         limitation is history, not transport: the free timeseries
#                         endpoint refuses a start date more than 366 days back, and the
#                         nightly runs on a machine with no cache, so this arm measures
#                         whether the host serves a runner at all — not that it could
#                         backfill 2015.
#
# Two more hosts are recorded robots-only: their robots.txt is fetched and the verdict
# written down, and their data paths are never requested. A probe that ignores a
# Disallow to find out what is behind it has answered a question nobody may act on.
#
# GC=F stays excluded on cost-of-carry grounds. Yahoo is not tested here.
#
# The arms mirroring production loaders (LBMA, FRED) do not honour robots.txt, because
# those loaders pass `check_robots=False` and a probe that behaves differently from the
# thing that failed is measuring something else. The new host is only fetched if its
# robots.txt permits it.
#
# It writes nothing to the repository. `permissions: contents: read` makes that a
# property of the token rather than a promise in a comment.

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: "Fetches per arm."
        type: string
        default: "5"

permissions:
  contents: read

defaults:
  run:
    working-directory: engine

jobs:
  probe:
    name: what do the candidate hosts return to a runner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - run: uv sync --frozen

      - name: fetch each candidate repeatedly and record what comes back
        env:
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import os
          import time
          from datetime import UTC, date, datetime, timedelta

          import requests

          from aurex.assets import get as get_asset
          from aurex.config import HTTP_COURTESY_DELAY, HTTP_TIMEOUT, USER_AGENT
          from aurex.data.sources import http
          from aurex.data.sources.fred import CSV_ENDPOINT
          from aurex.data.sources.lbma import GOLD_PM_URL

          attempts = int(os.environ["ATTEMPTS"])

          # Deliberately hammering several hosts, so be more courteous than production
          # rather than less: the configured delay is a floor here, not a target.
          delay = max(HTTP_COURTESY_DELAY, 2.0)

          # The tolerance the nightly refuses on, read from the asset rather than
          # recalled, so the lag column in any write-up is this repository's number.
          chain = get_asset("gold").price_sources()["xauusd"]
          tolerance = chain.freshness.describe() if chain.freshness else None

          today = datetime.now(UTC).date()

          # --- parsers ------------------------------------------------------------
          # Each returns the last observation date the body actually carries, or None
          # with a reason. A body that parses but ends in 2022 is a different failure
          # from one that does not parse, and the tabulation needs to tell them apart.

          def last_lbma(body: bytes) -> tuple[str | None, int | None, str | None]:
              payload = json.loads(body)
              dates = [row["d"] for row in payload if row.get("d")]
              return (max(dates) if dates else None), len(payload), None

          def last_fred_csv(body: bytes) -> tuple[str | None, int | None, str | None]:
              rows = list(csv.reader(io.StringIO(body.decode("utf-8", "replace"))))
              if len(rows) < 2:
                  return None, len(rows), "csv has no observations"
              # FRED marks non-trading days with "."; the last *observation* is the
              # last row carrying a number, which is not always the last row.
              dated = [r for r in rows[1:] if len(r) >= 2 and r[1] not in (".", "")]
              if not dated:
                  return None, len(rows) - 1, "every value is a FRED missing marker"
              return dated[-1][0], len(rows) - 1, None

          def last_fxratesapi(body: bytes) -> tuple[str | None, int | None, str | None]:
              payload = json.loads(body)
              if not payload.get("success", True):
                  return None, None, f"api reported failure: {payload.get('error')}"
              rates = payload.get("rates") or {}
              if not rates:
                  return None, 0, "no rates in payload"
              # Keys are ISO timestamps; the date part is the observation date.
              return max(rates)[:10], len(rates), None

          # --- arms ---------------------------------------------------------------

          fx_start = (today - timedelta(days=30)).isoformat()
          arms = [
              {
                  "name": "lbma_gold_pm",
                  "role": "control — the settled run's arm, unchanged",
                  "url": GOLD_PM_URL,
                  "parse": last_lbma,
                  "honour_robots": False,
              },
              {
                  "name": "fred_lbma_gold_pm",
                  "role": "candidate — FRED's redistribution of the LBMA PM fix",
                  "series_id": "GOLDPMGBD228NLBM",
                  "url": f"{CSV_ENDPOINT}?id=GOLDPMGBD228NLBM",
                  "parse": last_fred_csv,
                  "honour_robots": False,
              },
              {
                  "name": "fred_dexinus",
                  "role": "control — a live FRED series Aurex already loads",
                  "series_id": "DEXINUS",
                  "url": f"{CSV_ENDPOINT}?id=DEXINUS",
                  "parse": last_fred_csv,
                  "honour_robots": False,
              },
              {
                  "name": "fxratesapi_xau",
                  "role": "candidate — non-FRED, non-Yahoo host",
                  "url": (
                      "https://api.fxratesapi.com/timeseries"
                      f"?start_date={fx_start}&end_date={today.isoformat()}"
                      "&base=USD&currencies=XAU"
                  ),
                  "parse": last_fxratesapi,
                  "honour_robots": True,
              },
          ]

          # Considered and not fetched. Recorded here rather than in a comment so the
          # artifact carries the reason the candidate list is as short as it is.
          robots_only = [
              {
                  "name": "stooq_xauusd",
                  "url": "https://stooq.com/q/d/l/?s=xauusd&i=d",
                  "note": "free daily XAUUSD with full history; the obvious candidate",
              },
              {
                  "name": "wgc_fsapi",
                  "url": "https://fsapi.gold.org/api/goldprice/v11/chart/price/USD/2015-01-01/2026-08-17",
                  "note": "World Gold Council chart feed; also downsampled to ~491 points",
              },
          ]

          # The request is assembled to match aurex.data.sources.http.get exactly rather
          # than calling it, because `get` raises for non-2xx and a probe must record the
          # non-2xx rather than lose it. If these headers drift from that function the
          # probe stops measuring the thing that failed.
          headers = {"User-Agent": USER_AGENT, "Accept-Encoding": "gzip, deflate"}

          def egress_now() -> str:
              try:
                  return requests.get("https://api.ipify.org", timeout=10).text.strip()
              except Exception as exc:  # noqa: BLE001 - diagnostic only, never fatal
                  return f"unknown: {type(exc).__name__}"

          # Which egress address the runner drew. Taken at both ends: if the address
          # changes mid-sitting, every per-IP reading in the artifact is about two IPs.
          egress_start = egress_now()

          def robots_verdict(url: str) -> dict[str, object]:
              """What robots.txt says, and what the raw file was, without acting on it."""
              record: dict[str, object] = {"url": url}
              try:
                  record["allows"] = http.robots_allows(url)
              except Exception as exc:  # noqa: BLE001
                  record["allows"] = f"error: {type(exc).__name__}: {exc}"
              origin = "/".join(url.split("/")[:3])
              try:
                  response = requests.get(f"{origin}/robots.txt", headers=headers, timeout=15)
                  record |= {
                      "robots_status": response.status_code,
                      "robots_head": response.content[:200].decode("utf-8", "replace"),
                  }
              except Exception as exc:  # noqa: BLE001
                  record["robots_error"] = f"{type(exc).__name__}: {exc}"
              return record

          records: list[dict[str, object]] = []
          per_arm: dict[str, dict[str, object]] = {}

          for arm in arms:
              robots = robots_verdict(arm["url"])
              summary: dict[str, object] = {
                  "role": arm["role"],
                  "url": arm["url"],
                  "robots": robots,
                  "counts": {},
                  "last_observations": [],
                  "distinct_bodies": 0,
              }
              per_arm[arm["name"]] = summary

              if arm["honour_robots"] and robots.get("allows") is not True:
                  summary["counts"] = {"robots-skipped": attempts}
                  print(json.dumps({"arm": arm["name"], "outcome": "robots-skipped"}))
                  continue

              hashes: set[str] = set()
              for attempt in range(1, attempts + 1):
                  time.sleep(delay)

                  started = time.monotonic()
                  record: dict[str, object] = {
                      "arm": arm["name"],
                      "attempt": attempt,
                      "at": datetime.now(UTC).isoformat(),
                      "url": arm["url"],
                      "egress_ip": egress_start,
                  }
                  try:
                      response = requests.get(arm["url"], headers=headers, timeout=HTTP_TIMEOUT)
                  except Exception as exc:  # noqa: BLE001 - a transport failure is a result
                      record |= {
                          "outcome": "transport-error",
                          "error": f"{type(exc).__name__}: {exc}",
                          "elapsed_s": round(time.monotonic() - started, 3),
                      }
                      records.append(record)
                      print(json.dumps(record))
                      continue

                  body = response.content
                  digest = hashlib.sha256(body).hexdigest()
                  hashes.add(digest)
                  record |= {
                      "status": response.status_code,
                      "elapsed_s": round(time.monotonic() - started, 3),
                      "bytes": len(body),
                      "sha256": digest,
                      # The same one-line description a skip record would now carry.
                      "describe": http.describe_response(response),
                      "headers": {
                          name: value
                          for name, value in response.headers.items()
                          if name.lower() in http._DIAGNOSTIC_HEADERS
                          or name.lower().startswith("cf-")
                      },
                      # Names only, never values. This is the §1 answer to "could a
                      # retry work": whatever state the responder hands out here is
                      # dropped when this response object goes out of scope, because
                      # http.get builds a Session per call and keeps no jar.
                      "set_cookie_names": sorted(response.cookies.keys()),
                      "body_head": repr(body[:200]),
                  }

                  if response.status_code >= 400:
                      record["outcome"] = "http-error"
                  else:
                      try:
                          last, rows, why = arm["parse"](body)
                      except Exception as exc:  # noqa: BLE001 - unparseable is a result
                          record |= {
                              "outcome": "unparseable",
                              "error": f"{type(exc).__name__}: {exc}",
                          }
                      else:
                          record |= {
                              "outcome": "ok" if last else "parsed-but-empty",
                              "rows": rows,
                              "last_observation": last,
                              "parse_note": why,
                          }
                          if last:
                              lag = (today - date.fromisoformat(last)).days
                              record["lag_days"] = lag
                              if tolerance:
                                  record["within_tolerance"] = lag <= tolerance["max_lag_days"]

                  records.append(record)
                  print(json.dumps(record))

              counts: dict[str, int] = {}
              observed: list[str] = []
              for entry in records:
                  if entry["arm"] != arm["name"]:
                      continue
                  outcome = str(entry.get("outcome"))
                  counts[outcome] = counts.get(outcome, 0) + 1
                  if entry.get("last_observation"):
                      observed.append(str(entry["last_observation"]))
              summary |= {
                  "counts": counts,
                  "failure_rate": round(1 - counts.get("ok", 0) / attempts, 3),
                  "distinct_bodies": len(hashes),
                  "last_observations": sorted(set(observed)),
              }

          artifact = {
              "summary": {
                  "attempts_per_arm": attempts,
                  "delay_s": delay,
                  "user_agent": USER_AGENT,
                  "timeout_s": HTTP_TIMEOUT,
                  "egress_ip_start": egress_start,
                  "egress_ip_end": egress_now(),
                  "run_date_utc": today.isoformat(),
                  "xauusd_freshness_tolerance": tolerance,
                  "recorded_at": datetime.now(UTC).isoformat(),
              },
              "arms": per_arm,
              "considered_not_fetched": [
                  entry | robots_verdict(entry["url"]) for entry in robots_only
              ],
              "attempts": records,
          }

          with open("lbma-probe.json", "w") as handle:
              json.dump(artifact, handle, indent=2)

          print("\n" + json.dumps({"summary": artifact["summary"], "arms": per_arm}, indent=2))
          PY

      # `if: always()` because a probe that only uploads its findings when nothing went
      # wrong is not a probe.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbma-probe
          path: engine/lbma-probe.json
          if-no-files-found: error
