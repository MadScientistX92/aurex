name: Direction

# Step 6b, run by hand and never on a push. The sibling of shootout.yml, and separate
# from it for one reason that is not organisational: the two runs need opposite drift
# policies and cannot be the same job.
#
# The CRPS shootout centres every model, which is §0's position and the only way that
# comparison is about conditional variance rather than about eleven years of
# appreciation. But centring puts P(up) at about one half for every entrant by
# construction, so direction measured on that run grades the drift policy and would
# return "no model can call direction" whatever the models did. Here every competitor
# carries the drift it infers and the benchmark is the drift-matched walk.
#
# What is on every push is the statistics: the resolution screen lives in
# aurex/score/shootout.py beside SPA and the MCS, depends on nothing heavier than SciPy,
# and is tested in tests/test_shootout.py — including the size checks that say it does
# not find discrimination that is not there, and the one asserting that a permutation
# over-rejects on dependent data where the circular shift does not.
#
# The result is committed to public-data/direction.json on the same terms as the
# shootout: this job writes public-data/ and nothing else, and fails if it staged
# anything outside it. A job that could edit prose is a job that can rewrite the
# pre-registration it was meant to test.
#
# WHY THIS RUN MAY BE OFFLINE, AND WHY IT IS NOT BY DEFAULT. `aurex direction` applies
# **no** freshness guard: it calls `resolve_series` (aurex/cli.py:619) → `_resolve` →
# `chain.load` (aurex/pipeline.py:182, 199), and `assess()` is reached only from
# `pipeline.run` (aurex/pipeline.py:98) and `aurex pipeline` (aurex/cli.py:91). Neither is
# on this path. That is §6's test for when a cache is honest: this run makes no claim about
# today's price, so a series ending weeks ago grades exactly as well as a live one and
# dissolves nothing — the same argument that makes a cache right for `factors.yml` and
# wrong for `nightly.yml`, where the guard exists precisely to refuse the stale copy a
# cache would supply.
#
# So a cache is *permitted* here, and it is the better input when one exists: it drops the
# LBMA dependency, which fails roughly half the time from a runner. But `cache_dir`
# defaulted to `tests/fixtures/bench-cache`, a path that **has never existed in this
# repository** — so from the day the offline hunk landed until 2026-08-17 this job would
# have exited in its first minute, and never did, because the only run it ever had used the
# pre-offline version from `main`. A default naming a file nobody committed is not a
# default; it is a job that cannot run.
#
# The repair keeps both paths rather than dropping either. `cache_dir` now defaults to
# empty and means **resolve live**, which is what the one successful run actually did
# (32044823578, 3h14m, `--step 10`). Name a cache and the run goes offline against it, with
# the pre-flight below refusing one that does not cover the requested window rather than
# silently grading a shorter sample. Committing a cache that would restore the offline
# default is a separate decision and needs the LBMA history question settled first.
#
# Either way the artifact must say what it read. §6: a run reproducible only from a cache
# nobody can see is the `--to` problem wearing a different hat. The emitted block carries
# `resolution.offline`, `resolution.cache_dir` and `resolution.series_end`, and the guard
# step checks them **against the mode the run was dispatched in** — a live run that came
# back claiming `offline: true`, or a cache-backed run claiming `false`, is a run whose
# provenance does not describe it.

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Registered asset id to grade"
        type: string
        default: gold
      cache_dir:
        description: "Cache to resolve from, e.g. tests/fixtures/seed-cache. Empty resolves live."
        type: string
        default: ""
      from:
        description: "First forecast date (YYYY-MM-DD). A named cache must cover it."
        type: string
        default: "2015-01-01"
      to:
        description: "Last observation the run may see (YYYY-MM-DD). Empty uses the series' own end."
        type: string
        default: ""
      step:
        description: "Sessions between forecasts. Larger is faster and less powerful."
        type: string
        default: "5"
      models:
        description: "Comma-separated subset. Empty runs the whole set."
        type: string
        default: ""
      commit:
        description: "Commit the artifact to public-data/"
        type: boolean
        default: true

concurrency:
  group: shootout
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: engine

jobs:
  direction:
    name: six models on direction, against the drift-matched random walk
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: install the bench extra
        run: uv sync --frozen --extra bench

      - name: record what was actually installed
        run: |
          uv run python - <<'PY'
          import importlib.metadata as md
          for name in ("torch", "statsforecast", "neuralforecast", "chronos-forecasting"):
              try:
                  print(f"{name}=={md.version(name)}")
              except md.PackageNotFoundError:
                  print(f"{name}: NOT INSTALLED")
          PY

      # The cache is the entire input to this run, so its coverage is checked before
      # two hours of compute rather than discovered in the artifact afterwards. A cache
      # that starts after the requested `--from` does not fail — it silently grades a
      # shorter sample, and a resolution computed on fourteen months of prices would be
      # published under the same field names as one computed on eleven years.
      - name: the cache covers the window this run claims to grade
        if: inputs.cache_dir != ''
        env:
          AUREX_CACHE_DIR: ${{ inputs.cache_dir }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          import sys
          from datetime import date
          from pathlib import Path

          from aurex.assets import get

          asset = get("${{ inputs.asset }}")
          root = Path(os.environ["AUREX_CACHE_DIR"])
          wanted = date.fromisoformat("${{ inputs.from }}")

          meta_path = root / f"{asset.price_series_id}.meta.json"
          if not meta_path.exists():
              sys.exit(
                  f"no cached {asset.price_series_id} at {root}: this job resolves "
                  f"offline and has nothing to read"
              )

          meta = json.loads(meta_path.read_text())
          start, end = date.fromisoformat(meta["start"]), date.fromisoformat(meta["end"])
          print(f"cache {root}: {meta['rows']} rows, {start} to {end}")

          if start > wanted:
              sys.exit(
                  f"the cache starts {start}, after the requested --from {wanted}. "
                  f"This run would grade {start}..{end} and publish it under the same "
                  f"field names as the full sample. Extend the cache or move --from."
              )

          # min_observations for the volatility models, which refuse rather than fit on
          # a short history. Checked here so the refusal is one line at the top of the
          # log instead of a per-model skip buried two hours in.
          span = (end - start).days
          need = asset.vol_defaults.min_observations
          if span < need * 1.4:
              sys.exit(
                  f"the cache spans {span} calendar days; the volatility models need "
                  f"{need} observations before they will fit"
              )
          PY

      # `if-no-files-found: error` on the upload below protected nothing while the
      # committed copy was still sitting in the checkout. `aurex direction` writes
      # public-data/direction.json once, at the end, so run 31983796753 — cancelled at
      # 94% — uploaded the *repository's* file under this run's name, byte-identical to
      # the one on main (sha256 f1a34f34…). An artifact named `direction` from a run
      # that computed nothing is indistinguishable from one that computed everything
      # unless you hash it, which is §1's signature failure: an absence that reads as
      # confidence. Deleting it first is what gives the guard something real to fail on.
      #
      # The existence check is not ceremony. A mistyped path would make the deletion a
      # silent no-op and quietly restore the decoy, so a path this step cannot find is
      # an error here rather than a surprise in the artifact — the upload step names the
      # same file, and exactly one of the two can be right. The hash is printed because
      # it is the decoy's fingerprint: an uploaded artifact that ever matches it again
      # came from the checkout and not from this run.
      - name: delete the committed artifact so a failed run cannot upload it
        working-directory: .
        run: |
          set -euo pipefail
          target=public-data/direction.json
          if [ ! -f "$target" ]; then
            echo "$target is not in this checkout, so there is nothing to delete and"
            echo "the path is probably wrong — the upload step below names the same file."
            exit 1
          fi
          echo "the copy this run must not be allowed to pass off as its own:"
          sha256sum "$target"
          rm "$target"
          test ! -e "$target"
          echo "deleted $target; only this run can put it back"

      - name: grade direction
        env:
          AUREX_CACHE_DIR: ${{ inputs.cache_dir }}
        run: |
          set -euo pipefail
          args=(--asset "${{ inputs.asset }}" --from "${{ inputs.from }}" --step "${{ inputs.step }}")
          # Offline exactly when a cache was named. Passing --offline without one resolves
          # nothing and fails with "no cached xauusd", which is a worse way to say "you did
          # not give me any data" than simply going to the source.
          if [ -n "${{ inputs.cache_dir }}" ]; then
            args+=(--offline)
          fi
          if [ -n "${{ inputs.to }}" ]; then
            args+=(--to "${{ inputs.to }}")
          fi
          if [ -n "${{ inputs.models }}" ]; then
            args+=(--models "${{ inputs.models }}")
          fi
          uv run aurex direction "${args[@]}"

      # Three properties, each of which has a way of going quietly wrong.
      #
      # The sample must be bounded and the artifact must say how to reproduce it, as
      # everywhere else. The benchmark must be the *drift-matched* walk — if it ever
      # comes back as `random_walk`, the run was centred and every resolution figure in
      # it is about the drift policy rather than the models, which is precisely the
      # failure this run exists to escape. And every model must carry a resolution and
      # its bin occupancy, because a resolution of zero from a forecaster confined to one
      # bin is not a measurement and must not be published as one.
      - name: the artifact bounds its sample, names its null, and can measure what it claims
        working-directory: .
        env:
          EXPECT_OFFLINE: ${{ inputs.cache_dir != '' }}
        run: |
          uv run --project engine python - <<'PY'
          import json
          import os

          block = json.load(open("public-data/direction.json"))
          sample = block["sample"]
          assert sample["resolved"]["to"], "the run recorded no resolved end date"
          assert "--to" in block["reproduce"], block["reproduce"]

          # §6: an artifact must say what it read. Checked against the mode this job was
          # dispatched in rather than against a fixed expectation, because the job now
          # does both: a named cache means offline, an empty one means live. Asserting
          # one of those unconditionally is how the workflow spent a fortnight unable to
          # run at all without anyone finding out.
          expect_offline = os.environ["EXPECT_OFFLINE"] == "true"
          resolution = block["resolution"]
          assert resolution["offline"] is expect_offline, (
              f"dispatched with cache_dir {'set' if expect_offline else 'empty'}, so this "
              f"run should have resolved {'offline' if expect_offline else 'live'}, and "
              f"the artifact says offline={resolution['offline']}. Provenance that does "
              f"not describe the run is worse than none."
          )
          assert resolution["cache_dir"], "the run did not record which store it read"
          assert resolution["series_end"], "the run did not record the series' end date"
          assert resolution["series_end"] == block["source"]["end"], (
              f"the recorded end {resolution['series_end']} disagrees with the "
              f"series metadata {block['source']['end']}"
          )
          assert sample["resolved"]["to"] <= resolution["series_end"], (
              f"the sample ends {sample['resolved']['to']}, after the series' last "
              f"observation {resolution['series_end']}"
          )

          null = block["benchmark"]["label"]
          assert null == "random_walk_drift_matched", (
              f"benchmark is {null!r}: this run was centred, so every resolution in it "
              f"grades the drift policy rather than the models"
          )

          horizons = block["horizons"]
          assert horizons, "no horizon was scored at all"
          for entry in horizons:
              where = entry["horizon_sessions"]
              assert entry["models"], f"no models at horizon {where}"
              for model in entry["models"]:
                  assert "resolution" in model["decomposition"], model["model"]
              screens = entry["discrimination"]
              for name in (
                  "full_sample",
                  "non_overlapping_subsample",
                  "equal_count_bins_robustness",
                  "equal_count_non_overlapping_subsample",
              ):
                  assert screens[name] is not None, f"{name} missing at horizon {where}"
                  for label, row in screens[name]["models"].items():
                      assert "occupied_bins" in row, f"{label} at {where} has no bin count"
          print(
              f"direction OK: {len(horizons)} horizons, "
              f"{len(horizons[0]['models'])} models against {null}, "
              f"bounded to {sample['resolved']['to']}"
          )
          PY

      # The loop the --to work opened, closed. The artifact's internal consistency is
      # checked above; this checks the *README* against it. The direction section quotes
      # a placebo's resolution, two alternative nulls' p-values and a twelve-row
      # leave-one-year-out table, and for a while every one of those came from a scratch
      # file that no longer exists. A re-run that moves any of them now fails here rather
      # than being committed beside prose that still quotes the old ones.
      - name: the README's direction figures are this artifact's
        working-directory: engine
        run: uv run pytest tests/test_readme_direction.py -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direction
          path: public-data/direction.json
          if-no-files-found: error

      - name: commit public-data, and only public-data
        if: inputs.commit
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "aurex-shootout[bot]"
          git config user.email "aurex-shootout@users.noreply.github.com"

          git add public-data/

          outside=$(git diff --cached --name-only | grep -v '^public-data/' || true)
          if [ -n "$outside" ]; then
            echo "the direction job staged files outside public-data/:"
            echo "$outside"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit \
            -m "chore(bench): step 6b direction for ${{ inputs.asset }}" \
            -m "Run from ${GITHUB_SHA} by workflow_dispatch. The reproducing command and the resolved sample window are in the artifact."

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto the remote"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "could not push the direction result after three attempts"
          exit 1
